[project]
name = "atif-viewer"
version = "0.1.0"
description = "Browse ATIF v1.7 trajectories in a local, dependency-free web viewer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The only dependency is the converter. The viewer itself is stdlib http.server
# plus one self-contained HTML page.
dependencies = ["atif-make>=0.1.0"]

[project.scripts]
atif-viewer = "atif_viewer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# atif-make is not on PyPI, so resolve it from its repository. Pinning a tag
# keeps builds reproducible; switch to `branch = "main"` to track development,
# or drop this block entirely once atif-make is published to an index.
[tool.uv.sources]
atif-make = { git = "https://github.com/jammastergirish/atif-make", tag = "v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atif_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
