[project]
name = "atif-view"
version = "0.3.0"
description = "Browse ATIF v1.7 trajectories in a local, dependency-free web viewer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The only dependency is the converter. The viewer itself is stdlib http.server
# plus one self-contained HTML page.
# 0.2.0 is the floor, not politeness: Entry gained the content key this
# viewer addresses sessions by, so an older atif-make crashes on the index.
dependencies = ["atif-make>=0.2.0"]

[project.scripts]
atif-view = "atif_view.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# The two packages move together, so track atif-make's `main` rather than a
# release. Once atif-make is on PyPI you can delete this block entirely: the
# `dependencies` entry above already resolves from the index.
#
# uv still records an exact commit in uv.lock, which is what keeps a given
# checkout reproducible. To pick up newer atif-make commits, re-resolve:
#
#     uv lock --upgrade-package atif-make
#
[tool.uv.sources]
atif-make = { git = "https://github.com/jammastergirish/atif-make", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atif_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
