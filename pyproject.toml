[project]
name = "atif-viewer"
version = "0.1.0"
description = "Browse ATIF v1.7 trajectories in a local, dependency-free web viewer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The only dependency is the converter. The viewer itself is stdlib http.server
# plus one self-contained HTML page.
dependencies = ["atif-make>=0.1.0"]

[project.scripts]
atif-viewer = "atif_viewer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# Resolve the converter from the sibling checkout during development. Remove or
# override this to build against a published atif-make.
[tool.uv.sources]
atif-make = { path = "../atif-make", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atif_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
